<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Obsidian Void Gradient -->
    <radialGradient id="spaceVoid" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Star Core Radiant Bloom -->
    <radialGradient id="starBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Zenith Beams -->
    <linearGradient id="verticalBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </linearGradient>

    <!-- Primary Diamond Facet Gradient (Crisp Stellar White & Ice Cyan) -->
    <linearGradient id="facetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="facetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Secondary Facet Gradient (Silver Slate) -->
    <linearGradient id="facetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="celestialRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="zenithGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Celestial Medallion -->
  <circle cx="200" cy="200" r="188" fill="url(#spaceVoid)"/>

  <!-- Guiding Light Column projecting down through the Star -->
  <polygon points="200,40 245,360 155,360" fill="url(#verticalBeam)"/>

  <!-- Astronomical Astrolabe & Coordinate Grid Rings -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#celestialRing)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 6"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 4"/>

  <!-- Celestial Horizon & Meridian Lines -->
  <line x1="200" y1="18" x2="200" y2="382" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.35"/>
  <line x1="18" y1="200" x2="382" y2="200" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.35"/>

  <!-- Compass Cardinal Ticks (Guiding to Zenith) -->
  <polygon points="200,14 205,26 195,26" fill="#38bdf8"/>
  <polygon points="200,386 205,374 195,374" fill="#475569"/>
  <line x1="16" y1="200" x2="28" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="372" y1="200" x2="384" y2="200" stroke="#475569" stroke-width="1.5"/>

  <!-- Guiding Navigation Constellation Points -->
  <circle cx="95" cy="105" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="120" cy="80" r="2" fill="#e0f2fe" opacity="0.75"/>
  <line x1="95" y1="105" x2="120" y2="80" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3"/>

  <circle cx="305" cy="105" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="280" cy="80" r="2" fill="#e0f2fe" opacity="0.75"/>
  <line x1="305" y1="105" x2="280" y2="80" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3"/>

  <circle cx="95" cy="295" r="1.5" fill="#94a3b8" opacity="0.5"/>
  <circle cx="120" cy="320" r="2" fill="#e0f2fe" opacity="0.65"/>
  <line x1="95" y1="295" x2="120" y2="320" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25"/>

  <circle cx="305" cy="295" r="1.5" fill="#94a3b8" opacity="0.5"/>
  <circle cx="280" cy="320" r="2" fill="#e0f2fe" opacity="0.65"/>
  <line x1="305" y1="295" x2="280" y2="320" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- THE ZENITH GUIDING STAR (NORTHERN STAR / POLARIS) -->
  <g filter="url(#dropShadow)" transform="translate(200, 200)">
    <!-- Ambient Starlight Glow -->
    <circle cx="0" cy="0" r="85" fill="url(#starBloom)"/>

    <!-- Concentric Guiding Light Ring -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-width="1.25" stroke-dasharray="3 5" stroke-opacity="0.55"/>

    <!-- 4 Diagonal Faceted Diamond Rays -->
    <g transform="rotate(45)">
      <!-- Top Ray -->
      <polygon points="0,0 9,-12 0,-75 0,0" fill="url(#facetWhite)" opacity="0.9"/>
      <polygon points="0,0 -9,-12 0,-75 0,0" fill="url(#facetSilver)" opacity="0.75"/>

      <!-- Right Ray -->
      <polygon points="0,0 12,-9 75,0 0,0" fill="url(#facetWhite)" opacity="0.9"/>
      <polygon points="0,0 12,9 75,0 0,0" fill="url(#facetSilver)" opacity="0.75"/>

      <!-- Bottom Ray -->
      <polygon points="0,0 9,12 0,75 0,0" fill="url(#facetWhite)" opacity="0.9"/>
      <polygon points="0,0 -9,12 0,75 0,0" fill="url(#facetSilver)" opacity="0.75"/>

      <!-- Left Ray -->
      <polygon points="0,0 -12,-9 -75,0 0,0" fill="url(#facetWhite)" opacity="0.9"/>
      <polygon points="0,0 -12,9 -75,0 0,0" fill="url(#facetSilver)" opacity="0.75"/>
    </g>

    <!-- 4 Primary Cardinal Faceted Rays (Reaching toward Zenith) -->
    <!-- Upward Ray (The Zenith Apex Ray) -->
    <polygon points="0,0 14,-20 0,-140 -14,-20" fill="url(#facetWhite)" filter="url(#zenithGlow)"/>
    <polygon points="0,0 0,-140 14,-20" fill="#ffffff" opacity="0.95"/>
    <polygon points="0,0 0,-140 -14,-20" fill="url(#facetCyan)" opacity="0.95"/>

    <!-- Downward Ray (The Guiding Path Ray) -->
    <polygon points="0,0 13,18 0,125 -13,18" fill="url(#facetWhite)"/>
    <polygon points="0,0 0,125 13,18" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,0 0,125 -13,18" fill="url(#facetCyan)" opacity="0.9"/>

    <!-- Right Horizontal Ray -->
    <polygon points="0,0 18,-13 120,0 18,13" fill="url(#facetWhite)"/>
    <polygon points="0,0 120,0 18,-13" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,0 120,0 18,13" fill="url(#facetCyan)" opacity="0.9"/>

    <!-- Left Horizontal Ray -->
    <polygon points="0,0 -18,-13 -120,0 -18,13" fill="url(#facetWhite)"/>
    <polygon points="0,0 -120,0 -18,-13" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,0 -120,0 -18,13" fill="url(#facetCyan)" opacity="0.9"/>

    <!-- Core Star Diamond Centerpiece -->
    <polygon points="0,-24 18,0 0,24 -18,0" fill="#ffffff" filter="url(#zenithGlow)"/>
    <polygon points="0,-18 13,0 0,18 -13,0" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>
