name: Template Tests & Quality Gates

env:
    UV_NO_SYNC: true
    PYTHONWARNDEFAULTENCODING: "1"
    PYTHONUTF8: "1"
    UV_NO_SOURCES_PACKAGE: taplo

permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: 🎨 Code Quality & Structural Analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: 🛠️ Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 🛠️ Install uv and use Python 3.13
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: 🛠️ Install project dependencies
              run: uv sync --frozen

            - name: 🐍 Run ruff linter check
              run: uv run poe lint

            - name: 🐍 Run ruff formatter check
              run: uv run poe format-check

            - name: ⚙️ Run taplo TOML formatter check
              run: uv run poe format-check-toml

            - name: 🎨 Run prettier YAML check
              run: uv run poe format-yaml

            - name: 🎨 Run prettier CSS check
              run: uv run poe format-css

            - name: 📝 Run rumdl Markdown check
              run: uv run poe lint-md

            - name: 📦 Check declared dependencies with deptry
              run: uv run poe dependencies

            - name: 🔄 Verify skills symlinks
              run: uv run poe sync-skills-check

            - name: 🔍 Validate agent skills structural invariants
              run: uv run poe check-skills

            - name: 📝 Run ASD-STE100 linter
              run: uv run poe lint-ste

            - name: 🐍 Run pyrefly static type check
              run: uv run poe type-check

            - name: 🧮 Run complexipy complexity check
              run: uv run poe complexity

            - name: 🔤 Run typos spell check
              run: uv run poe typos

            - name: 🛡️ Run zizmor GitHub Actions security audit
              run: uv run poe zizmor

            - name: 🔍 Audit rendered template variants
              run: uv run poe lint-rendered

    test:
        name: 🐍 Template Test Suite (${{ matrix.os }}, py${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                python-version: ["3.12", "3.13", "3.14"]
                include:
                    - os: macos-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.13"

        steps:
            - name: 🛠️ Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 🛠️ Install uv and use Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: 🛠️ Install project dependencies
              run: uv sync --frozen

            - name: 🧪 Run pytest suite with coverage
              run: uv run poe test

            - name: 🧹 Verify clean working tree after tests
              shell: bash
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "::error::Tests left untracked or modified files in the working tree:"
                      git status --short
                      exit 1
                  fi

    canary:
        name: 🎡 Zenith Wheel Showcase Canary
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: 🛠️ Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 🛠️ Install uv and use Python 3.13
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: 🎡 Build zenith-template wheel
              run: uv build --wheel --out-dir dist

            - name: 🚀 Scaffold zenith-example using only built wheel
              run: |
                  WHEEL_PATH=$(find dist -name "zenith_template-*.whl" | head -n 1)
                  mkdir -p /tmp/canary
                  cd /tmp/canary
                  uvx --from "$GITHUB_WORKSPACE/$WHEEL_PATH" zenith-template \
                      --no-input \
                      --name "Zenith Example" \
                      --slug "zenith-example" \
                      --package "zenith_example" \
                      --description "Demonstration and showcase repository instantiated from the Zenith template." \
                      --author "bwrob" \
                      --email "contact@bwrob.dev" \
                      --github "bwrob" \
                      --python-version "3.13" \
                      --license "MIT" \
                      --include-cli \
                      --include-docs \
                      --include-mutation \
                      --include-ci \
                      --include-skills \
                      --ai-tools all \
                      --init-git \
                      --run-uv-sync \
                      --install-git-hooks \
                      .

            - name: 🧪 Run test suite in scaffolded showcase
              run: |
                  cd /tmp/canary/zenith-example
                  uv run poe test

            - name: 🎨 Run code quality in scaffolded showcase
              run: |
                  cd /tmp/canary/zenith-example
                  uv run poe code-quality

    check:
        name: 🛠️ All Checks Status
        if: always()
        needs:
            - quality
            - test
            - canary
        runs-on: ubuntu-latest
        steps:
            - name: Decide whether all required jobs succeeded
              uses: re-actors/alls-green@release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
