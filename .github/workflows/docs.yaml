name: Docs

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: 📖 Build Documentation
        runs-on: ubuntu-latest
        steps:
            - name: 🛠️ Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 🛠️ Install uv and use Python 3.13
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: "3.13"
                  enable-cache: true

            - name: Install documentation dependencies
              run: uv sync --group docs

            - name: Build documentation with Zensical
              id: build_docs
              run: uv run zensical build --clean --strict

            - name: 📋 Summarize documentation build failures
              if: failure() && steps.build_docs.outcome == 'failure'
              run: |
                  echo "### ⚠️ Documentation Build Failed" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "To reproduce documentation build failures locally, run:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```bash' >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe docs-build" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Pages artifact
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site

    deploy:
        name: 🚀 Deploy Documentation to GitHub Pages
        needs: build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write # Required to deploy site artifacts to GitHub Pages
            id-token: write # Required for GitHub Pages OIDC authentication
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
