# ==============================================================================
# Tach Configuration (tach.toml)
#
# Tool: Tach (https://github.com/gauge-sh/tach)
# Purpose: Modular architecture and dependency boundary enforcement for Python.
# Why it's in Zenith: Enforces architectural boundaries between package modules
# (e.g. CLI layer depends on Core, but Core must never depend on CLI) and prevents
# circular dependencies from creeping in.
# ==============================================================================

exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
    "**/.venv",
    "**/site",
]
interfaces = []
source_roots = ["src"]

exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = true
{% if cookiecutter.include_cli in [True, "yes", "true", "True", "1"] %}
layers = ["cli", "core"]
{% else %}
layers = ["core"]
{% endif %}
respect_gitignore = true

[rules]
    require_ignore_directive_reasons = "error"
    unused_ignore_directives         = "error"


[[modules]]
    depends_on = []
    layer      = "core"
    path       = "{{ cookiecutter.package_name }}"

{% if cookiecutter.include_cli in [True, "yes", "true", "True", "1"] %}
[[modules]]
    depends_on = ["{{ cookiecutter.package_name }}.cli"]
    layer      = "cli"
    path       = "{{ cookiecutter.package_name }}.__main__"

[[modules]]
    depends_on = []
    layer      = "cli"
    path       = "{{ cookiecutter.package_name }}.cli"
{% endif %}
