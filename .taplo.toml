exclude = [
    ".temp/**",
    ".venv/**",
    "*cookiecutter.project_slug*/zensical.toml",
    "*cookiecutter.project_slug*/tach.toml",
    "*cookiecutter.project_slug*/pyproject.toml",
    "*cookiecutter.project_slug*/poe_tasks.toml",
    "build/**",
    "dist/**",
    "site/**",
]

[formatting]
    align_entries   = true
    compact_arrays  = true
    compact_entries = false
    indent_entries  = true
    indent_string   = "    "
    indent_tables   = true
    reorder_keys    = true
