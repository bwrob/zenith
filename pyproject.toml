[project]
    authors = [ { name = "bwrob", email = "contact@bwrob.dev" } ]
    classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: Software Development :: Build Tools",
        "Topic :: Software Development :: Code Generators",
        "Typing :: Typed",
    ]
    dependencies = [ "cookiecutter>=2.7.0" ]
    description = "Zenith: An opinionated, strict Cookiecutter template for modern Python projects using uv, ruff, pyrefly, complexipy, zensical, rumdl, tach, and poethepoet."
    name = "zenith"
    readme = "README.md"
    requires-python = ">=3.12"
    version = "0.1.0"

    [project.urls]
        Homepage   = "https://github.com/bwrob/zenith"
        Repository = "https://github.com/bwrob/zenith.git"

[dependency-groups]
    dev = [
        "poethepoet>=0.42.0",
        "prek>=0.5.5",
        "pytest>=8.0.0",
        "pytest-cov>=6.0.0",
        "pytest-xdist>=3.8.0",
        "ruff>=0.17.0",
        "rumdl>=0.0.8",
        "taplo>=0.9.3",
    ]
    docs = [
        "markdown-exec>=1.12.0",
        "mkdocstrings[python]>=0.28.0",
        "pymdown-extensions>=10.14.0",
        "typst>=0.13.0",
        "zensical>=0.0.8",
    ]

[tool.uv]
    package = false

[tool.poe.tasks]
    check-skills = { cmd = "python scripts/check_skills.py .agents/skills", help = "Validate agent skills structural invariants." }
    code-quality = { sequence = [
        "lint",
        "format-check",
        "format-check-toml",
        "format-yaml",
        "format-css",
        "sync-skills-check",
        "check-skills",
        "test",
    ], help = "Run linting, formatting check, skills check, and test suite." }
    docs-build = { cmd = "zensical build --strict --clean", help = "Build static HTML documentation site into site/." }
    docs-logo = { cmd = "typst compile assets/zenith-star.typ assets/zenith-star.svg", help = "Compile documentation logotype SVG with Typst." }
    docs-serve = { cmd = "zensical serve", help = "Start live-reloading documentation dev server." }
    fix = { ignore_fail = "return_zero", sequence = [
        { cmd = "ruff check --fix" },
        { cmd = "ruff format" },
        { cmd = "taplo format" },
        { cmd = "rumdl fmt docs/" },
        { cmd = "prek run prettier --all-files" },
        { cmd = "prek run prettier-css --all-files" },
    ], help = "Auto-fix linting and formatting issues." }
    format = { cmd = "ruff format", help = "Format Python code with Ruff." }
    format-check = { cmd = "ruff format --check", help = "Check formatting with Ruff." }
    format-check-toml = { cmd = "taplo format --check", help = "Check TOML configuration files with Taplo." }
    format-css = { cmd = "prek run prettier-css --all-files", help = "Format CSS stylesheets with Prettier via prek." }
    format-md = { cmd = "rumdl fmt docs/", help = "Format documentation with rumdl." }
    format-toml = { cmd = "taplo format", help = "Format TOML configuration files with Taplo." }
    format-yaml = { cmd = "prek run prettier --all-files", help = "Format YAML configuration files with Prettier via prek." }
    lint = { cmd = "ruff check", help = "Lint codebase with Ruff." }
    lint-ste = { cmd = "python .agents/skills/guide-ste100/scripts/ste-lint.py .agents/skills", help = "Lint agent skills against ASD-STE100 structural rules." }
    sync-example = { cmd = "python scripts/sync_example.py", help = "Render and sync showcase repository (zenith-example)." }
    sync-skills = { cmd = "python scripts/sync_skills.py", help = "Synchronize repo skills as symlinks from template source of truth." }
    sync-skills-check = { cmd = "python scripts/sync_skills.py --check", help = "Check that repo skills are properly symlinked to template source of truth." }
    test = { cmd = "pytest -n auto --dist=worksteal --max-worker-restart=0 --cov --cov-report=term-missing --cov-report=xml", env = { COVERAGE_FILE = "/tmp/.zenith_coverage" }, help = "Run unit test suite in parallel with xdist and 100% coverage." }

[tool.pytest.ini_options]
    norecursedirs = [ "{{cookiecutter.project_slug}}", ".*", "build", "dist" ]
    pythonpath    = [ "." ]
    testpaths     = [ "tests" ]

[tool.ruff]
    extend-exclude = [ "*cookiecutter.project_slug*" ]
