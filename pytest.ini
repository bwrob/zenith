# ==============================================================================
# Pytest Configuration (pytest.ini)
#
# Tool: Pytest (https://docs.pytest.org/)
# Purpose: The standard testing framework for Python applications and libraries.
# Why it's in Zenith: Configured with verbose outputs, doctest discovery, strict
# config/marker checks, import isolation, zero-tolerance warning gates, and
# integration with pytest-cov for coverage measurement on every test run.
# ==============================================================================

[pytest]
addopts                = -q -ra --durations=3 -p no:legacypath --doctest-modules --import-mode=importlib --strict-config --strict-markers
empty_parameter_set_mark = fail_at_collect
faulthandler_timeout   = 60
minversion             = 9.0
norecursedirs          = {{cookiecutter.project_slug}} .* build dist
pythonpath             =
    .
    .agents/skills/sdd-spec/scripts
    .agents/skills/sdd-review/scripts
    .agents/skills/sdd/scripts
    .agents/skills/guide-ste100/scripts
    .agents/skills/workflow-inspect-repo/scripts
strict                 = true
testpaths              = tests
xfail_strict           = true
filterwarnings         =
    error
    ignore::coverage.exceptions.CoverageWarning
    ignore::DeprecationWarning:click.*
    default::EncodingWarning
doctest_optionflags    =
    DONT_ACCEPT_TRUE_FOR_1
    NORMALIZE_WHITESPACE
    ELLIPSIS
