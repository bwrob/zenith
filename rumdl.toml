enable = ["ALL"]
exclude = [
    ".git",
    ".github",
    ".agents",
    ".venv",
    ".ruff_cache",
    ".rumdl_cache",
    ".complexipy_cache",
    ".temp",
    "site",
    "dist",
]
extend-enable = ["MD063", "MD080", "MD083", "MD085", "MD090", "MD093"]
flavor = "gfm"
line-length = 88
respect-gitignore = true

[per-file-ignores]
    # Keep standard Keep a Changelog headings and duplicate release categories.
    "docs/changelog.md" = ["MD080", "MD082"]

    # Preserve lowercase skill IDs embedded in descriptive headings.
    "docs/skills/guide.md"    = ["MD063"]
    "docs/skills/sdd.md"      = ["MD063"]
    "docs/skills/tool.md"     = ["MD063"]
    "docs/skills/workflow.md" = ["MD063"]

    # GFM treats Zensical tabs and admonitions as indented code blocks.
    "docs/tools/typer.md" = ["MD046"]

    # Jinja partials render their own blank lines after generation.
    "??cookiecutter.project_slug??/README.md"     = ["MD022"]
    "??cookiecutter.project_slug??/docs/index.md" = ["MD022"]

    # Conditional list branches create false positives before generation.
    "??cookiecutter.project_slug??/AGENTS.md" = ["MD032"]

    # Jinja source values create generated-only Markdown differences.
    "??cookiecutter.project_slug??/SECURITY.md" = ["MD060"]
    # Unrendered Jinja prevents MD013 from recognizing the final URL as a link.
    "??cookiecutter.project_slug??/docs/adr/index.md"       = ["MD013", "MD060"]
    "??cookiecutter.project_slug??/docs/changelog.md"       = ["MD013", "MD082"]
    "??cookiecutter.project_slug??/docs/getting-started.md" = ["MD046"]

    # These files are rendered partials with Jinja URLs and conditional badges.
    "templates/_badges.md"          = ["MD034", "MD041", "MD057"]
    "templates/docs/_tool_stack.md" = ["MD041"]

[code-block-tools]
    enabled                = true
    on-error               = "warn"
    on-missing-tool-binary = "warn"

    [code-block-tools.language-aliases]
        "bash"     = "shell"
        "py"       = "python"
        "python3"  = "python"
        "{bash}"   = "shell"
        "{json}"   = "json"
        "{python}" = "python"
        "{py}"     = "python"

    [code-block-tools.languages.python]
        format = ["ruff:format"]
        lint   = ["ruff:check"]

    [code-block-tools.languages.json]
        format = ["jq"]

    [code-block-tools.tools."ruff:format"]
        command = ["ruff", "format", "-"]

    [code-block-tools.tools."ruff:check"]
        command = [
            "ruff",
            "check",
            "--preview",
            "--isolated",
            "--output-format=concise",
            "--ignore=D,T201,missing-required-import",
            "-",
        ]

[MD001]
    front-matter-title = true

[MD003]
    style = "atx"

[MD004]
    style = "dash"

[MD007]
    indent = 2

[MD009]
    strict = true

[MD010]
    code-blocks = true

[MD012]
    maximum = 1

[MD013]
    code-block-line-length = 88
    code-blocks            = true
    headings               = false
    line-length            = 88
    math-blocks            = false
    reflow                 = true
    tables                 = false

[MD022]
    lines-above = 1
    lines-below = 1

[MD026]
    punctuation = ".,;:!"

[MD031]
    list-items = true

[MD033]
    allowed-elements = [
        "a",
        "audio",
        "br",
        "details",
        "div",
        "i",
        "iframe",
        "img",
        "kbd",
        "p",
        "span",
        "sub",
        "summary",
        "sup",
        "table",
        "tbody",
        "td",
        "th",
        "thead",
        "tr",
        "video",
    ]

[MD035]
    style = "---"

[MD046]
    style = "fenced"

[MD048]
    style = "backtick"

[MD049]
    style = "asterisk"

[MD050]
    style = "asterisk"

[MD058]
    minimum-after  = 1
    minimum-before = 1

[MD059]
    prohibited-texts = ["click here", "here", "link", "read more"]

[MD060]
    aligned-delimiter = false
    column-align      = "left"
    enabled           = true
    loose-last-column = false
    pad-width         = 1
    style             = "aligned"
